<h1>Settings</h1>
<p class="note"><strong>Note:</strong> MTU uses the array position as the key. Names are only there to make the config readable and are ignored by the logic.</p>

<textarea id="config" placeholder="Loading configuration..."></textarea>

<div class="row">
  <button class="primary" id="save">Save</button>
  <button class="ghost" id="reload">Reload from device</button>
</div>
<p class="feedback" id="feedback"></p>

<hr />
<button class="danger" id="reset">Factory reset</button>
